[project]
name = "herbal-evidence-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx`:DeprecationWarning", "ignore:The anyio.abc.BlockingPortal:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
